    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f4f1ea;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
        .animate-bounce-fast { animation: bounce 0.8s infinite; }
        
        /* New Landscape Animations */
        .animate-sway { animation: sway 5s ease-in-out infinite; transform-origin: bottom center; }
        @keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
        
        .animate-drift { animation: drift linear infinite; }
        @keyframes drift { 0% { transform: translateX(-20vw); } 100% { transform: translateX(120vw); } }
        .animate-spin-slow { animation: spin 25s linear infinite; }
        
        .game-btn { box-shadow: 0 6px 0px rgba(0,0,0,0.15); transition: all 0.1s; }
        .game-btn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0px 0px rgba(0,0,0,0.15); }
        .level-locked { filter: grayscale(100%) opacity(0.5); pointer-events: none; }
        
        .error-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); } }
        
        .screen-container { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease-in-out; }
        .slide-in-right { transform: translateX(0%); opacity: 1; pointer-events: auto; }
        .slide-out-left { transform: translateX(-100%); opacity: 0; pointer-events: none; }
        .slide-out-right { transform: translateX(100%); opacity: 0; pointer-events: none; }

        .particle { position: absolute; pointer-events: none; animation: pop 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes pop { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); opacity: 0; } }
        
        .star-filled { filter: grayscale(0%) opacity(1); transform: scale(1.1); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .star-empty { filter: grayscale(100%) opacity(0.3); transform: scale(0.9); transition: all 0.3s; }
        
        .comic-bubble { position: relative; }
        .comic-bubble::after { content: ''; position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); border-width: 20px 20px 0; border-style: solid; border-color: rgba(255,255,255,0.95) transparent transparent transparent; display: block; width: 0; }

        #map-nodes::-webkit-scrollbar, #level-playarea::-webkit-scrollbar { width: 10px; }
        #map-nodes::-webkit-scrollbar-track, #level-playarea::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 10px; margin-block: 10px; }
        #map-nodes::-webkit-scrollbar-thumb, #level-playarea::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }

        .tts-active { box-shadow: 0 0 0 6px rgba(52, 211, 153, 0.4); border-color: #34d399 !important; transform: scale(1.02); transition: all 0.3s ease-in-out; }

        .parallax-item { position: absolute; opacity: 0.4; animation: floatUp linear infinite; }
        @keyframes floatUp { 0% { transform: translateY(100vh) rotate(0deg); opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.6; } 100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; } }
    </style>
</head>

    <script>
        const GameState = {
            unlockedLevel: 1,
            currentLevelObj: null,
            currentScreen: 'hub',
            currentQuestionIndex: 0
        };

        const SoundManager = {
            isMusicPlaying: false,
            initialized: false,
            bgMusic: null,
            bgLoop: null,
            uiSynth: null,
            fxSynth: null,
            errorSynth: null,

            init() {
                if(this.initialized) return;
                
                this.uiSynth = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 }}).toDestination();
                this.uiSynth.volume.value = -15;

                this.fxSynth = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 0.3, sustain: 0.2, release: 1 }}).toDestination();
                this.fxSynth.volume.value = -10;

                this.errorSynth = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 2, oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.2 }}).toDestination();
                this.errorSynth.volume.value = -10;

                this.bgMusic = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.02, decay: 0.1, sustain: 0.1, release: 0.5 }}).toDestination();
                this.bgMusic.volume.value = -22;

        function sanitizeForSpeech(text) {
            let safeText = text;
            const dictionary = {"Kia ora": "Hello", "Pīwakawaka": "Fantail bird", "Kekeno": "New Zealand fur seal", "Ka pai": "Good job", "Tino Pai Rawa Atu": "Excellent", "Tino pai": "Very good", "Ka mau te wehi": "Awesome", "Aotearoa": "New Zealand"};
            for (const [maori, english] of Object.entries(dictionary)) {
                safeText = safeText.replace(new RegExp(maori, "gi"), english);
            }
            return safeText;
        }

        function speak(text, includeOptions = false) {
            window.speechSynthesis.cancel();
            let fullText = sanitizeForSpeech(text);
            if (includeOptions && GameState.currentLevelObj) {
                const q = GameState.currentLevelObj.questions[GameState.currentQuestionIndex];
                fullText += ". The choices are: ";
                q.options.forEach((opt, index) => fullText += sanitizeForSpeech(opt) + (index === q.options.length - 1 ? "." : ", or, "));
            }
            const utterance = new SpeechSynthesisUtterance(fullText);
            if (femaleVoice) utterance.voice = femaleVoice;
            utterance.rate = 0.9; utterance.pitch = 1.2;
            
            const instructionBox = document.getElementById('instruction-box');
            if (instructionBox && GameState.currentScreen === 'level') {
                utterance.onstart = () => instructionBox.classList.add('tts-active');
                utterance.onend = () => instructionBox.classList.remove('tts-active');
                utterance.onerror = () => instructionBox.classList.remove('tts-active');
            }
            
            window.speechSynthesis.speak(utterance);
        }

        function burstStars(x, y) {
            const symbols = ['💼', '📈', '🎉', '💡', '🎊'];
            for (let i = 0; i < 20; i++) {
                let particle = document.createElement('div');
                particle.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                particle.className = 'particle text-3xl z-50';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 80 + Math.random() * 120;
                particle.style.setProperty('--tx', `calc(-50% + ${Math.cos(angle) * velocity}px)`);
                particle.style.setProperty('--ty', `calc(-50% + ${Math.sin(angle) * velocity}px)`);
                particle.style.setProperty('--rot', `${Math.random() * 360}deg`);
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 800);
            }
        }

        function renderHub() {
            const container = document.getElementById('map-nodes');
            container.innerHTML = '';
            // Soft pastel buttons
            const colors = ['bg-rose-300', 'bg-amber-300', 'bg-teal-300', 'bg-indigo-300', 'bg-emerald-300'];
            const textColors = ['text-rose-900', 'text-amber-900', 'text-teal-900', 'text-indigo-900', 'text-emerald-900'];
            
            levelsData.forEach((level, index) => {
                const isLocked = level.id > GameState.unlockedLevel;
                const colorClass = colors[index % colors.length];
                const textClass = textColors[index % textColors.length];
                
                const btn = document.createElement('button');
                btn.className = `game-btn p-6 rounded-3xl border-4 border-white text-left flex items-center gap-4 ${isLocked ? 'bg-gray-200 level-locked shadow-none border-b-4' : `${colorClass} hover:brightness-105 shadow-[0_8px_0_rgba(0,0,0,0.1)] border-b-8 active:border-b-4 active:translate-y-1 transition-all`}`;
                btn.innerHTML = `<div class="text-4xl sm:text-6xl bg-white/40 rounded-full p-3 drop-shadow-sm">${isLocked ? '🔒' : level.icon}</div><div><div class="font-black text-lg sm:text-2xl ${textClass} drop-shadow-sm">${level.title}</div><div class="text-sm sm:text-lg font-bold ${isLocked ? 'text-gray-500' : 'text-black/50'}">${isLocked ? 'Locked' : level.subject}</div></div>`;
                if (!isLocked) btn.onclick = () => loadLevel(level);
                container.appendChild(btn);
            });
        }

        function loadLevel(level, isNextQuestion = false) {
            GameState.currentLevelObj = level;
            GameState.currentScreen = 'level';
            
            if (!isNextQuestion) {
                GameState.currentQuestionIndex = 0;
                document.getElementById('screen-hub').classList.replace('slide-in-right', 'slide-out-left');
                document.getElementById('screen-level').classList.replace('slide-out-right', 'slide-in-right');
                
                const bgContainer = document.getElementById('level-bg-elements');
                bgContainer.innerHTML = ''; 
                
                const bgSymbols = {
                    1: ['🧾', '📈', '💲'], 2: ['🏦', '💳', '📉'], 3: ['📢', '🛒', '📱'], 
                    4: ['🤝', '👥', '♟️'], 5: ['🏭', '🚚', '📦'], 6: ['📊', '🌍', '📉'], 
                    7: ['💻', '⚖️', '🛡️']
                };
                const levelSymbols = bgSymbols[level.id] || ['✨', '🍃', '☀️'];
                for(let i=0; i<12; i++) {
                    const el = document.createElement('div');
                    el.innerText = levelSymbols[Math.floor(Math.random() * levelSymbols.length)];
                    el.className = 'parallax-item text-4xl sm:text-6xl drop-shadow-md';
                    el.style.left = `${Math.random() * 100}vw`;
                    el.style.animationDuration = `${10 + Math.random() * 15}s`;
                    el.style.animationDelay = `-${Math.random() * 20}s`;
                    bgContainer.appendChild(el);
                }
            }
            
            const currentQ = level.questions[GameState.currentQuestionIndex];
            const totalQ = level.questions.length;
            
            const progressContainer = document.getElementById('level-progress');
            progressContainer.innerHTML = '';
            for (let i = 0; i < totalQ; i++) {
                const star = document.createElement('span');
                star.innerText = '⭐';
                star.className = `text-base sm:text-xl drop-shadow-sm ${i <= GameState.currentQuestionIndex ? 'star-filled' : 'star-empty'}`;
                progressContainer.appendChild(star);
            }
            
            document.getElementById('level-instruction').innerText = currentQ.instruction;
            document.getElementById('level-visual').innerHTML = currentQ.visualHTML;
            
            const charEl = document.getElementById('level-character');
            charEl.innerHTML = document.getElementById(level.characterId).innerHTML;
            charEl.className = 'animate-float mb-4 z-20 drop-shadow-2xl scale-110 sm:scale-125';

            const optionsContainer = document.getElementById('level-options');
            optionsContainer.innerHTML = '';
            const optionColors = ['bg-amber-100 border-amber-300 text-amber-900', 'bg-teal-100 border-teal-300 text-teal-900', 'bg-rose-100 border-rose-300 text-rose-900'];
            currentQ.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                const optStyle = optionColors[idx % optionColors.length];
                btn.className = `game-btn ${optStyle} hover:brightness-95 font-black text-xl sm:text-3xl py-4 sm:py-5 px-6 sm:px-8 rounded-3xl border-b-8 border-x-4 border-t-4 w-full sm:w-auto min-w-[220px] shadow-[0_6px_0_rgba(0,0,0,0.1)] active:border-b-4 active:translate-y-1 transition-all flex-1`;
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, level, btn);
                optionsContainer.appendChild(btn);
            });

            // Auto-scroll to top when new question loads so instruction is visible
            document.getElementById('level-playarea').scrollTop = 0;
        }

        function checkAnswer(selected, level, btnElement) {
            const currentQ = level.questions[GameState.currentQuestionIndex];
            const allBtns = document.getElementById('level-options').querySelectorAll('button');
            
            if (selected === currentQ.correctAnswer) {
                SoundManager.playSuccess();
                allBtns.forEach(b => b.disabled = true);
                btnElement.classList.replace('bg-amber-100', 'bg-emerald-200');
                btnElement.classList.replace('bg-teal-100', 'bg-emerald-200');
                btnElement.classList.replace('bg-rose-100', 'bg-emerald-200');
                btnElement.classList.add('text-emerald-900', 'scale-105', 'border-emerald-400');
                
                const rect = btnElement.getBoundingClientRect();
                burstStars(rect.left + rect.width / 2, rect.top + rect.height / 2);

                const charEl = document.getElementById('level-character');
                charEl.classList.replace('animate-float', 'animate-bounce-fast');

                speak(currentQ.successMsg);

                const isLastQuestion = GameState.currentQuestionIndex === level.questions.length - 1;
                
                if (!isLastQuestion) {
                    setTimeout(() => {
                        const loader = document.getElementById('loading-overlay');
                        loader.classList.remove('hidden');
                        loader.classList.add('pointer-events-auto');
                        setTimeout(() => loader.classList.remove('opacity-0'), 10);
                        
                        setTimeout(() => {
                            GameState.currentQuestionIndex++;
                            loadLevel(level, true);
                            
                            loader.classList.add('opacity-0');
                            loader.classList.remove('pointer-events-auto');
                            setTimeout(() => loader.classList.add('hidden'), 300);
                        }, 800);
                    }, 1200);
                } else {
                    setTimeout(() => {
                        if (level.id === levelsData.length) {
                            const modal = document.getElementById('modal-finale');
                            const box = document.getElementById('finale-box');
                            modal.classList.remove('hidden'); setTimeout(() => box.classList.remove('scale-90'), 50);
                            speak("Tino Pai Rawa Atu! You completed the whole journey!");
                        } else {
                            document.getElementById('success-msg').innerText = "You mastered " + level.title + "!";
                            const modal = document.getElementById('modal-success');
                            const box = document.getElementById('success-box');
                            modal.classList.remove('hidden'); setTimeout(() => box.classList.remove('scale-90'), 50);
                            if (GameState.unlockedLevel === level.id && GameState.unlockedLevel < levelsData.length) GameState.unlockedLevel++;
                        }
                    }, 1000);
                }
            } else {
                SoundManager.playError();
                btnElement.classList.replace('bg-white', 'bg-red-200');
                setTimeout(() => btnElement.classList.replace('bg-red-200', 'bg-white'), 500);
                speak("Not quite! Let's try again. " + currentQ.instruction);
                
                const charEl = document.getElementById('level-character');
                charEl.classList.remove('animate-float');
                charEl.classList.add('error-shake');
                setTimeout(() => { charEl.classList.remove('error-shake'); charEl.classList.add('animate-float'); }, 500);
            }
        }

        window.onload = () => {
            document.getElementById('btn-back')?.addEventListener('click', () => {
                GameState.currentScreen = 'hub'; GameState.currentLevelObj = null;
                document.getElementById('screen-level').classList.replace('slide-in-right', 'slide-out-right');
                document.getElementById('screen-hub').classList.replace('slide-out-left', 'slide-in-right');
                window.speechSynthesis.cancel(); renderHub();
            });
            
            document.getElementById('btn-next')?.addEventListener('click', () => {
                const modal = document.getElementById('modal-success'); const box = document.getElementById('success-box');
                box.classList.add('scale-90'); setTimeout(() => modal.classList.add('hidden'), 200);
                document.getElementById('btn-back').click();
            });
            
            document.getElementById('btn-restart')?.addEventListener('click', () => {
                const modal = document.getElementById('modal-finale'); const box = document.getElementById('finale-box');
                box.classList.add('scale-90'); setTimeout(() => modal.classList.add('hidden'), 200);
                GameState.unlockedLevel = 1; document.getElementById('btn-back').click();
            });
            
            document.getElementById('btn-speech')?.addEventListener('click', () => {
                if (GameState.currentScreen === 'hub') speak(document.getElementById('hub-instruction').innerText);
                else if (GameState.currentScreen === 'level' && GameState.currentLevelObj) speak(GameState.currentLevelObj.questions[GameState.currentQuestionIndex].instruction, true);
            });
            
            document.getElementById('btn-music')?.addEventListener('click', () => SoundManager.toggleMusic());
            
            document.body.addEventListener('click', (e) => {
                if (e.target.closest('.game-btn') && e.target.id !== 'btn-music') {
                    SoundManager.playClick();
                }
            });
            
            renderHub();
        };
    </script>
</body>
</html>
